[project]
name = "commodity-analytic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "K. Ivashchenko", email = "kivaschenko@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "apache-airflow>=3.3.2",
    "apache-airflow-providers-celery>=3.24.0",
    "apache-airflow-providers-postgres>=7.0.2",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.103",
    "celery-valkey-backend>=0.1.0",
    "pandas>=3.0.6",
    "pyspark>=4.2.0",
    "sqlalchemy>=2.1.1",
    "yfinance>=1.7.0",
]

[project.scripts]
commodity-analytic = "commodity_analytic:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
