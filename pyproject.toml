[tool.poetry]
name = "commodity-analytic"
version = "0.1.0"
description = "Production-grade commodity analytics pipeline with multi-source extraction, medallion architecture, and warehouse OLAP design"
authors = ["K. Ivashchenko <your.email@example.com>"]
readme = "README.md"
license = "MIT"
packages = [
    { include = "parser_services" },
    { include = "staging" },
    { include = "transformation" },
    { include = "warehouse" },
    { include = "analytics" },
    { include = "monitoring" },
    { include = "config" },
    { include = "scripts" },
    { include = "dags" },
]

[tool.poetry.dependencies]
python = ">=3.10,<3.13 || >3.13,<4.0"

# Core Orchestration
apache-airflow = "3.0.6"
apache-airflow-providers-postgres = "6.5.2"

# Data Processing
pandas = "^2.1.0"
numpy = "^1.24.0"
pyspark = "^3.5.0"

# Web Scraping & API
requests = "^2.31.0"
beautifulsoup4 = "^4.12.0"
yfinance = "^0.2.32"

# Data Warehouse
sqlalchemy = "^1.4.49"
psycopg2-binary = "^2.9.9"
# snowflake-sqlalchemy = "^1.5.0"  # Optional: uncomment for Snowflake support (requires build tools)

# AWS/S3
boto3 = "^1.42.0"

# Data Quality & Validation
great-expectations = "^0.17.0"

# Utilities
python-dotenv = "^1.0.0"
pydantic = "^2.0.0"
pyarrow = "^13.0.0"

# Monitoring & Logging
slack-sdk = "^3.23.0"
email-validator = "^2.1.0"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.0"

# Code Quality
black = "^23.11.0"
flake8 = "^6.1.0"
pylint = "^3.0.0"
mypy = "^1.7.0"
isort = "^5.13.0"

# Development
ipython = "^8.17.0"
jupyter = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
skip_glob = ["*/migrations/*", "*/venv/*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=. --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.pylint.main]
max-line-length = 100
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
]
